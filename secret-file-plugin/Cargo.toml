# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-secret-file-plugin"
version = "1.0.0"
publish = false            # first-party signed cdylib, shipped as a packed/signed tarball, not to crates.io
edition = "2021"
rust-version = "1.97"
description = "The file secret source as a droppable busbar plugin: a cdylib exporting the secret kind's door. Drop it in the plugins folder and reference secrets as { file: /path }."
license = "Apache-2.0"

[lib]
# cdylib: the DROPPED-IN door, exporting `busbar_plugin_door`.
# rlib: what `cargo test` links, and what the conformance test depends on to have the cdylib built.
crate-type = ["cdylib", "rlib"]

[dependencies]
# THE LOGIC, same repo: its `door::door` is the door this image exports.
busbar-secret-file = { path = "../secret-file" }
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "c4d725436d011d22c7eb9659f15b5b7ea78c4a9a" }

[dev-dependencies]
# The conformance test loads the built cdylib and the linked door over the REAL loader — dev-only,
# never in the shipped artifact. Same pinned rev, so one busbar source resolves.
busbar-plugin-loader = { git = "https://github.com/GetBusbar/busbar", rev = "c4d725436d011d22c7eb9659f15b5b7ea78c4a9a" }
serde_json = "1"
