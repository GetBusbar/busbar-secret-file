# SPDX-License-Identifier: Apache-2.0
#
# RENDERED by `cargo xtask fleet render busbar-secret-file` from GetBusbar/busbar's plugins.yaml and
# .github/fleet/workspace-Cargo.toml; `cargo xtask fleet check` is red on any edit here.
#
# One repo per plugin, every repo a twin: this workspace is exactly two crates, the logic
# (`secret-file/`, the rlib a busbar build can link) and the thin cdylib that packages it as a
# droppable `kind: secret` plugin (`secret-file-plugin/`, crate `busbar-secret-file-plugin`). Its busbar
# dependencies are git dependencies on GetBusbar/busbar at the fleet pin (`.busbar-ref` field 1);
# no sibling-checkout path dependency ships in any manifest.
[workspace]
resolver = "2"
members = [
    "secret-file",
    "secret-file-plugin",
]

[workspace.package]
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
publish = false
repository = "https://github.com/GetBusbar/busbar-secret-file"

[workspace.dependencies]
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "c4d725436d011d22c7eb9659f15b5b7ea78c4a9a" }
busbar-plugin-loader = { git = "https://github.com/GetBusbar/busbar", rev = "c4d725436d011d22c7eb9659f15b5b7ea78c4a9a" }
