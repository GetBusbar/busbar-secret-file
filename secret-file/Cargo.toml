# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-secret-file"
version = "1.0.0"
publish = false            # linked into busbar at a pinned rev, or shipped as a signed tarball; never to crates.io
edition = "2021"
rust-version = "1.97"
description = "The file secret source for busbar's kind:secret plugin family, on the secret kind's memory ABI: `{ file: /path }` resolves to the file's bytes, untouched, fail-closed."
license = "Apache-2.0"

[lib]
# rlib only: the logic and its door. A build that LINKS this crate registers `door::door` as its
# row (no symbol is exported from here); the dropped-in cdylib is `busbar-secret-file-plugin`
# (same repo), which exports the same door as `busbar_plugin_door`.
crate-type = ["rlib"]

[dependencies]
# The ONE busbar crate a plugin names (#40: contract only), pinned by git rev to `.busbar-ref`.
busbar-contract = { workspace = true }
serde_json = { workspace = true }
# The read buffer is wiped on every path but the one that hands the bytes back (THE DESIGN §6).
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
# `O_NOCTTY` for the one open (`read_file`): a terminal named as a secret never becomes the
# controlling terminal.
libc = { workspace = true }
